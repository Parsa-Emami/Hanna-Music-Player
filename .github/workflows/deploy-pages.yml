name: Deploy Hanna Music Player to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hanna-music-pages
  cancel-in-progress: true

env:
  PAGES_URL: https://parsa-emami.github.io/Hanna-Music-Player

jobs:
  build:
    name: Build Hanna Music Player
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Create Laravel environment
        shell: bash
        run: |
          mkdir -p database
          touch database/database.sqlite

          cat > .env <<EOF
          APP_NAME="Hanna Music Player"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=${PAGES_URL}
          ASSET_URL=${PAGES_URL}

          APP_LOCALE=fa
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=fa_IR

          LOG_CHANNEL=stderr
          LOG_LEVEL=error

          DB_CONNECTION=sqlite
          DB_DATABASE=${GITHUB_WORKSPACE}/database/database.sqlite

          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync

          FILESYSTEM_DISK=local
          EOF

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Prepare Laravel
        run: |
          php artisan key:generate --force
          php artisan optimize:clear
          php artisan route:list

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Verify Vite build
        shell: bash
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "ERROR: public/build/manifest.json was not generated."
            exit 1
          fi

          echo "Vite build completed successfully."
          find public/build -maxdepth 2 -type f | sort

      - name: Verify music files
        shell: bash
        run: |
          AUDIO_DIRECTORY="public/music/audio"

          if [ ! -d "${AUDIO_DIRECTORY}" ]; then
            echo "ERROR: ${AUDIO_DIRECTORY} does not exist."
            exit 1
          fi

          AUDIO_COUNT=$(find "${AUDIO_DIRECTORY}" \
            -maxdepth 1 \
            -type f \
            \( \
              -iname "*.mp3" \
              -o -iname "*.m4a" \
              -o -iname "*.aac" \
              -o -iname "*.ogg" \
              -o -iname "*.wav" \
              -o -iname "*.flac" \
            \) \
            | wc -l)

          echo "Audio files found: ${AUDIO_COUNT}"
          du -sh "${AUDIO_DIRECTORY}"

          if [ "${AUDIO_COUNT}" -eq 0 ]; then
            echo "ERROR: No supported audio files were found."
            exit 1
          fi

      - name: Start temporary Laravel server
        shell: bash
        run: |
          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > laravel-server.log 2>&1 &

          echo $! > laravel-server.pid

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/ \
              > /dev/null; then

              echo "Laravel server is ready."
              exit 0
            fi

            sleep 1
          done

          echo "ERROR: Laravel server did not become ready."

          if [ -f laravel-server.log ]; then
            cat laravel-server.log
          fi

          exit 1

      - name: Prepare static website
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          # کپی تمام فایل‌های عمومی:
          # build، music، تصاویر، favicon و سایر فایل‌ها
          cp -a public/. _site/

          # فایل‌های مخصوص اجرای Laravel روی Pages لازم نیستند
          rm -f _site/index.php
          rm -f _site/.htaccess
          rm -f _site/hot

          # لینک‌های نمادین ممکن است داخل Artifact معتبر نباشند
          find _site -type l -delete

          touch _site/.nojekyll

      - name: Export Laravel homepage
        shell: bash
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            http://127.0.0.1:8000/ \
            --output _site/index.html

          # جایگزینی احتیاطی آدرس سرور موقت
          sed -i \
            "s#http://127.0.0.1:8000#${PAGES_URL}#g" \
            _site/index.html

          sed -i \
            "s#http://localhost:8000#${PAGES_URL}#g" \
            _site/index.html

          cp _site/index.html _site/404.html

      - name: Validate static output
        shell: bash
        run: |
          if [ ! -s _site/index.html ]; then
            echo "ERROR: _site/index.html is missing or empty."

            if [ -f laravel-server.log ]; then
              cat laravel-server.log
            fi

            exit 1
          fi

          # عنوان واقعی دو حرف n دارد: Hanna
          if ! grep -Fq "Hanna Music" _site/index.html; then
            echo "ERROR: Hanna Music title was not found in index.html."
            echo "First 80 lines of generated HTML:"
            sed -n '1,80p' _site/index.html
            exit 1
          fi

          # بررسی وجود رابط پخش آهنگ
          if ! grep -Fq "data-player-track" _site/index.html; then
            echo "ERROR: No playable tracks were rendered."
            echo "Check public/music/audio and HomeController."
            sed -n '1,120p' _site/index.html
            exit 1
          fi

          # آدرس لوکال نباید در خروجی نهایی باقی مانده باشد
          if grep -Eq \
            "127\.0\.0\.1:8000|localhost:8000" \
            _site/index.html; then

            echo "ERROR: Local server URLs remain in index.html."
            exit 1
          fi

          echo "Hanna Music static export validated successfully."
          echo "Published site size:"
          du -sh _site

          echo "Published audio count:"
          find _site/music/audio \
            -maxdepth 1 \
            -type f \
            | wc -l

          echo "Generated page title:"
          grep -i -A2 -B1 "<title" _site/index.html || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Hanna Music
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4