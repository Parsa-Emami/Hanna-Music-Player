name: Deploy Hanna Music Player to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hanna-music-pages
  cancel-in-progress: true

env:
  PAGES_URL: https://parsa-emami.github.io/Hanna-Music-Player


jobs:

  build:

    name: Build Hanna Music Player
    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"



      - name: Create Laravel environment
        shell: bash
        run: |

          mkdir -p database

          touch database/database.sqlite


          cat > .env <<EOF

          APP_NAME="Hanna Music Player"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false

          APP_URL=${PAGES_URL}
          ASSET_URL=${PAGES_URL}


          APP_LOCALE=fa
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=fa_IR


          LOG_CHANNEL=stderr
          LOG_LEVEL=error


          DB_CONNECTION=sqlite
          DB_DATABASE=${GITHUB_WORKSPACE}/database/database.sqlite


          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync


          FILESYSTEM_DISK=local

          EOF



      - name: Install Composer dependencies
        run: |

          composer install \
          --no-dev \
          --prefer-dist \
          --optimize-autoloader \
          --no-interaction \
          --no-progress



      - name: Generate Laravel key

        run: |

          php artisan key:generate --force

          php artisan optimize:clear




      - name: Install NPM dependencies

        run: |

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi




      - name: Build frontend assets

        run:

          npm run build




      - name: Verify assets

        run: |

          test -f public/build/manifest.json

          echo "Vite build OK"




      - name: Verify music files

        shell: bash

        run: |

          if [ ! -d public/music/audio ]; then

            echo "Music folder missing"

            exit 1

          fi


          COUNT=$(find public/music/audio -type f | wc -l)


          echo "Music files: $COUNT"


          if [ "$COUNT" -eq 0 ]; then

            echo "No music found"

            exit 1

          fi



      - name: Start Laravel server

        shell: bash

        run: |

          php artisan serve \
          --host=127.0.0.1 \
          --port=8000 \
          > laravel.log 2>&1 &


          for i in {1..30}; do

            if curl -s http://127.0.0.1:8000 > /dev/null;

            then

              echo "Laravel ready"

              exit 0

            fi


            sleep 1

          done


          cat laravel.log

          exit 1




      - name: Create static site folder

        run: |

          rm -rf _site

          mkdir _site





      - name: Export Laravel homepage

        shell: bash

        run: |


          curl \
          --fail \
          --silent \
          http://127.0.0.1:8000/ \
          --output _site/index.html



          cp _site/index.html _site/404.html




      - name: Copy public assets

        shell: bash

        run: |


          cp -R public/build _site/build

          cp -R public/music _site/music



      - name: Fix GitHub Pages paths

        shell: bash

        run: |


          sed -i \
          "s#href=\"/#href=\"/Hanna-Music-Player/#g" \
          _site/index.html



          sed -i \
          "s#src=\"/#src=\"/Hanna-Music-Player/#g" \
          _site/index.html



          sed -i \
          "s#/music/#/Hanna-Music-Player/music/#g" \
          _site/index.html



          sed -i \
          "s#/build/#/Hanna-Music-Player/build/#g" \
          _site/index.html





      - name: Validate output

        shell: bash

        run: |


          if ! grep -q "Hana Music" _site/index.html;

          then

            echo "ERROR: Hanna page not generated"

            cat _site/index.html | head -50

            exit 1

          fi



          echo "Static export successful"


          du -sh _site




      - name: Add nojekyll

        run:

          touch _site/.nojekyll




      - name: Configure Pages

        uses: actions/configure-pages@v5





      - name: Upload artifact

        uses: actions/upload-pages-artifact@v4

        with:

          path: _site





  deploy:


    name: Deploy Hanna Music


    runs-on: ubuntu-latest


    needs: build



    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}



    steps:


      - name: Deploy Pages


        id: deployment


        uses: actions/deploy-pages@v4