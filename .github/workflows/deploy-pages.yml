name: Deploy Hanna Music Player to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hanna-music-pages
  cancel-in-progress: true

env:
  PAGES_URL: https://parsa-emami.github.io/Hanna-Music-Player

jobs:
  build:
    name: Build Hanna Music Player
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Ensure FFmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || \
             ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Create Laravel environment
        shell: bash
        run: |
          mkdir -p database
          touch database/database.sqlite

          cat > .env <<EOF_ENV
          APP_NAME="Hanna Music Player"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=${PAGES_URL}
          ASSET_URL=${PAGES_URL}

          APP_LOCALE=fa
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=fa_IR

          LOG_CHANNEL=stderr
          LOG_LEVEL=error

          DB_CONNECTION=sqlite
          DB_DATABASE=${GITHUB_WORKSPACE}/database/database.sqlite

          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync

          FILESYSTEM_DISK=local
          EOF_ENV

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Prepare Laravel
        run: |
          php artisan key:generate --force
          php artisan optimize:clear
          php artisan route:list

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Verify Vite build
        shell: bash
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "ERROR: public/build/manifest.json was not generated."
            exit 1
          fi

          echo "Vite build completed successfully."
          find public/build -maxdepth 2 -type f | sort

      - name: Normalize audio for mobile browsers
        shell: bash
        run: |
          set -euo pipefail

          AUDIO_DIRECTORY="public/music/audio"
          NORMALIZED_DIRECTORY="${RUNNER_TEMP}/hanna-normalized-audio"

          if [ ! -d "${AUDIO_DIRECTORY}" ]; then
            echo "ERROR: ${AUDIO_DIRECTORY} does not exist."
            exit 1
          fi

          rm -rf "${NORMALIZED_DIRECTORY}"
          mkdir -p "${NORMALIZED_DIRECTORY}"

          AUDIO_COUNT=0

          while IFS= read -r -d '' SOURCE_FILE; do
            AUDIO_COUNT=$((AUDIO_COUNT + 1))

            FILENAME="$(basename "${SOURCE_FILE}")"
            STEM="${FILENAME%.*}"
            TARGET_FILE="${NORMALIZED_DIRECTORY}/${STEM}.mp3"

            CODEC="$(
              ffprobe \
                -v error \
                -select_streams a:0 \
                -show_entries stream=codec_name \
                -of default=noprint_wrappers=1:nokey=1 \
                "${SOURCE_FILE}" \
                | head -n 1
            )"

            if [ -z "${CODEC}" ]; then
              echo "ERROR: No audio stream found in ${FILENAME}."
              exit 1
            fi

            if [ -e "${TARGET_FILE}" ]; then
              echo "ERROR: Duplicate audio basename after MP3 normalization: ${STEM}"
              exit 1
            fi

            if [ "${CODEC}" = "mp3" ] && \
               [[ "${FILENAME,,}" == *.mp3 ]]; then
              cp "${SOURCE_FILE}" "${TARGET_FILE}"
              echo "Already mobile compatible: ${FILENAME}"
            else
              echo "Converting ${FILENAME} (${CODEC}) to ${STEM}.mp3"

              ffmpeg \
                -nostdin \
                -hide_banner \
                -loglevel error \
                -y \
                -i "${SOURCE_FILE}" \
                -map 0:a:0 \
                -vn \
                -c:a libmp3lame \
                -b:a 192k \
                -ar 44100 \
                -ac 2 \
                -map_metadata 0 \
                "${TARGET_FILE}"
            fi
          done < <(
            find "${AUDIO_DIRECTORY}" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*.mp3" \
                -o -iname "*.m4a" \
                -o -iname "*.aac" \
                -o -iname "*.ogg" \
                -o -iname "*.wav" \
                -o -iname "*.flac" \
              \) \
              -print0
          )

          if [ "${AUDIO_COUNT}" -eq 0 ]; then
            echo "ERROR: No supported audio files were found."
            exit 1
          fi

          find "${AUDIO_DIRECTORY}" \
            -maxdepth 1 \
            -type f \
            \( \
              -iname "*.mp3" \
              -o -iname "*.m4a" \
              -o -iname "*.aac" \
              -o -iname "*.ogg" \
              -o -iname "*.wav" \
              -o -iname "*.flac" \
            \) \
            -delete

          cp -a "${NORMALIZED_DIRECTORY}/." "${AUDIO_DIRECTORY}/"

          while IFS= read -r -d '' MP3_FILE; do
            CODEC="$(
              ffprobe \
                -v error \
                -select_streams a:0 \
                -show_entries stream=codec_name \
                -of default=noprint_wrappers=1:nokey=1 \
                "${MP3_FILE}" \
                | head -n 1
            )"

            if [ "${CODEC}" != "mp3" ]; then
              echo "ERROR: ${MP3_FILE} is not a real MP3 file. Codec: ${CODEC}"
              exit 1
            fi
          done < <(
            find "${AUDIO_DIRECTORY}" \
              -maxdepth 1 \
              -type f \
              -iname "*.mp3" \
              -print0
          )

          echo "Mobile-compatible audio files:"
          find "${AUDIO_DIRECTORY}" \
            -maxdepth 1 \
            -type f \
            -iname "*.mp3" \
            -printf '%f\n' \
            | sort

          du -sh "${AUDIO_DIRECTORY}"

      - name: Start temporary Laravel server
        shell: bash
        run: |
          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > laravel-server.log 2>&1 &

          echo $! > laravel-server.pid

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/ \
              > /dev/null; then

              echo "Laravel server is ready."
              exit 0
            fi

            sleep 1
          done

          echo "ERROR: Laravel server did not become ready."
          cat laravel-server.log || true
          exit 1

      - name: Prepare static website
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          cp -a public/. _site/

          rm -f _site/index.php
          rm -f _site/.htaccess
          rm -f _site/hot
          find _site -type l -delete

          touch _site/.nojekyll

      - name: Export Laravel homepage
        shell: bash
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            http://127.0.0.1:8000/ \
            --output _site/index.html

          sed -i \
            "s#http://127.0.0.1:8000#${PAGES_URL}#g" \
            _site/index.html

          sed -i \
            "s#http://localhost:8000#${PAGES_URL}#g" \
            _site/index.html

          cp _site/index.html _site/404.html

      - name: Validate static output and audio URLs
        shell: bash
        run: |
          python3 <<'PYTHON'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          site = Path('_site')
          index = site / 'index.html'

          if not index.is_file() or index.stat().st_size == 0:
              raise SystemExit('ERROR: _site/index.html is missing or empty.')

          html = index.read_text(encoding='utf-8')

          if 'Hanna Music' not in html:
              raise SystemExit('ERROR: Hanna Music title was not found.')

          class TrackParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if 'data-player-track' in attributes:
                      url = attributes.get('data-audio-url')
                      if url:
                          self.urls.append(url)

          parser = TrackParser()
          parser.feed(html)

          if not parser.urls:
              raise SystemExit('ERROR: No playable tracks were rendered.')

          missing = []
          invalid_extensions = []

          for url in parser.urls:
              path = unquote(urlparse(url).path)
              marker = '/Hanna-Music-Player/'

              if marker in path:
                  relative = path.split(marker, 1)[1]
              else:
                  relative = path.lstrip('/')

              if not relative.lower().endswith('.mp3'):
                  invalid_extensions.append(url)

              if not (site / relative).is_file():
                  missing.append((url, relative))

          if invalid_extensions:
              raise SystemExit(
                  'ERROR: Non-MP3 URLs remain in generated HTML:\n' +
                  '\n'.join(invalid_extensions)
              )

          if missing:
              raise SystemExit(
                  'ERROR: Generated audio URLs do not point to files:\n' +
                  '\n'.join(f'{url} -> {path}' for url, path in missing)
              )

          if '127.0.0.1:8000' in html or 'localhost:8000' in html:
              raise SystemExit('ERROR: Local server URLs remain in index.html.')

          print(f'Validated {len(parser.urls)} playable MP3 tracks.')
          PYTHON

          echo "Hanna Music static export validated successfully."
          echo "Published site size:"
          du -sh _site

          echo "Published audio count:"
          find _site/music/audio \
            -maxdepth 1 \
            -type f \
            -iname "*.mp3" \
            | wc -l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Hanna Music
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
